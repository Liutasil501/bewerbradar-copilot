name: Production health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public endpoints
        id: probe
        shell: bash
        run: |
          set +e
          health_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/health.json --write-out '%{http_code}' https://copilot.bewerbradar.de/api/health)"
          landing_status="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' https://copilot.bewerbradar.de/de)"

          healthy=true
          if [ "$health_status" != '200' ] || [ "$landing_status" != '200' ]; then
            healthy=false
          fi

          echo "healthy=${healthy}" >> "$GITHUB_OUTPUT"
          echo "health_status=${health_status}" >> "$GITHUB_OUTPUT"
          echo "landing_status=${landing_status}" >> "$GITHUB_OUTPUT"

      - name: Open or resolve production incident
        uses: actions/github-script@v7
        env:
          HEALTHY: ${{ steps.probe.outputs.healthy }}
          HEALTH_STATUS: ${{ steps.probe.outputs.health_status }}
          LANDING_STATUS: ${{ steps.probe.outputs.landing_status }}
        with:
          script: |
            const title = '[Monitor] BewerbRadar production unavailable';
            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const incident = openIssues.find((issue) => issue.title === title && !issue.pull_request);

            if (process.env.HEALTHY !== 'true') {
              const body = [
                'The scheduled production probe failed.',
                '',
                `- Health endpoint HTTP: ${process.env.HEALTH_STATUS}`,
                `- Landing page HTTP: ${process.env.LANDING_STATUS}`,
                `- Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                '',
                'This issue is closed automatically after a successful recovery probe.',
              ].join('\n');

              if (incident) {
                await github.rest.issues.createComment({ owner, repo, issue_number: incident.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
              core.setFailed('Production probe failed.');
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: `Recovery confirmed by ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                state: 'closed',
              });
            }
